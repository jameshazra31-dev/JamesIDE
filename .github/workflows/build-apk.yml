name: Build APK (simple)

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths-ignore: ["**.md"]

jobs:
  build:
    name: Assemble Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check project is present
        run: |
          if [ ! -f settings.gradle.kts ]; then
            echo "Project not imported yet, skipping build."
            exit 0
          fi

      - name: Set up JDK 21
        if: hashFiles('settings.gradle.kts') != ''
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        if: hashFiles('settings.gradle.kts') != ''
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        if: hashFiles('settings.gradle.kts') != ''
        run: chmod +x ./gradlew

      - name: Assemble Debug APK
        if: hashFiles('settings.gradle.kts') != ''
        run: ./gradlew :core:app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        if: hashFiles('settings.gradle.kts') != ''
        uses: actions/upload-artifact@v4
        with:
          name: james-ide-debug-apk
          path: core/app/build/outputs/apk/debug/*.apk
