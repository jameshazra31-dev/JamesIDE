# rerun 2
name: Diagnose build

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths: [".github/workflows/diagnose-build.yml"]

permissions:
  contents: write

jobs:
  diagnose:
    name: Build and capture log
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build and capture log
        run: |
          set -o pipefail
          ./gradlew :core:app:assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/build.log || true

      - name: Publish log to repo
        run: |
          mkdir -p ci
          {
            echo '# Build log (last 500 lines)'
            echo ''
            echo '~~~'
            tail -n 500 /tmp/build.log
            echo '~~~'
          } > ci/build-log.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci/build-log.md
          git commit -m "ci: capture build log"
          git pull --rebase origin main || true
          git push origin main
